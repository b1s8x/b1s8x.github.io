<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inboxer Live Earth</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #050507;
            --card: #111116;
            --text: #f4f4f5;
            --accent: #8b5cf6;
            --hit: #10b981;
            --twofa: #f59e0b;
            --bad: #ef4444;
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }
        .header { width: 100%; text-align: center; padding: 20px 0 10px; }
        .header h1 {
            margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
            background: linear-gradient(90deg, #8b5cf6, #38bdf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status-badge {
            display: inline-block; padding: 4px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 700; margin-top: 8px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .status-running { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.4); }
        .status-done { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
        .status-stopped { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
        .status-idle { background: rgba(113, 113, 122, 0.15); color: #71717a; border: 1px solid rgba(113, 113, 122, 0.4); }

        #globeContainer {
            width: 100%; max-width: 380px; aspect-ratio: 1/1;
            position: relative; margin: 10px 0;
        }
        #globeCanvas { width: 100%; height: 100%; display: block; }
        .globe-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); pointer-events: none; text-align: center;
        }
        .globe-overlay .total-hits {
            font-size: 52px; font-weight: 900; color: var(--hit);
            text-shadow: 0 0 25px rgba(16, 185, 129, 0.6); line-height: 1;
        }
        .globe-overlay .label {
            font-size: 11px; color: #71717a; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px;
        }

        .stats-grid {
            width: 100%; max-width: 380px;
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; padding: 0 15px; box-sizing: border-box;
        }
        .stat-card {
            background: var(--card); padding: 12px 8px; border-radius: 12px;
            text-align: center; border: 1px solid #27272a;
        }
        .stat-value { font-size: 22px; font-weight: 800; }
        .stat-label { font-size: 10px; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

        .regions-list, .hits-list {
            width: 100%; max-width: 380px; padding: 15px; box-sizing: border-box; margin-top: 10px;
        }
        .section-title {
            font-size: 12px; font-weight: 700; color: #71717a;
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px;
        }
        .region-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #27272a;
        }
        .region-item:last-child { border-bottom: none; }
        .region-left { display: flex; align-items: center; gap: 12px; }
        .region-flag { font-size: 22px; }
        .region-name { font-weight: 600; font-size: 14px; }
        .region-right { text-align: right; }
        .region-count { font-weight: 800; color: var(--accent); font-size: 16px; }
        .region-pct { font-size: 11px; color: #71717a; }

        .hit-item {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.03), rgba(139, 92, 246, 0.03));
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .hit-item:hover { 
            border-color: rgba(16, 185, 129, 0.5); 
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1); 
        }
        .hit-email { 
            font-family: 'Courier New', monospace; 
            font-size: 13px; 
            color: #e4e4e7; 
            font-weight: 600; 
            word-break: break-all; 
            margin-bottom: 4px;
        }
        .hit-meta { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 11px; 
            color: #a1a1aa; 
        }
        .hit-time { 
            font-family: monospace; 
            color: #38bdf8; 
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Inboxer</h1>
        <div id="statusBadge" class="status-badge status-running">Running</div>
    </div>

    <div id="globeContainer">
        <canvas id="globeCanvas"></canvas>
        <div class="globe-overlay">
            <div class="total-hits" id="totalHits">0</div>
            <div class="label">Total Hits</div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" style="color: var(--text);" id="statChecked">0</div>
            <div class="stat-label">Checked</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" style="color: var(--twofa);" id="statTwofa">0</div>
            <div class="stat-label">2FA</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" style="color: var(--bad);" id="statBad">0</div>
            <div class="stat-label">Bad</div>
        </div>
    </div>

    <div class="regions-list">
        <div class="section-title">Live Regions</div>
        <div id="regionsList"></div>
    </div>

    <div class="hits-list">
        <div class="section-title">Live Hits</div>
        <div id="hitsList"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        const STATS_URL = 'live_stats.json'; 

        const GEO = {
            US: [39, -98], GB: [55, -3], CA: [56, -106], AU: [-25, 133], DE: [51, 10], FR: [46, 2], 
            IN: [20, 78], JP: [36, 138], BR: [-14, -51], RU: [61, 105], MX: [23, -102], SA: [23, 45], 
            AE: [23, 54], TR: [38, 35], NL: [52, 5], SE: [60, 18], NO: [60, 8], DK: [56, 10], 
            FI: [61, 25], PL: [51, 19], CZ: [49, 15], GR: [39, 22], PT: [39, -8], IE: [53, -8], 
            CH: [46, 8], AT: [47, 14], BE: [50, 4], KR: [35, 127], CN: [35, 105], ES: [40, -4], IT: [41, 12]
        };

        const FLAGS = {
            US: "🇺🇸", GB: "🇬🇧", CA: "🇨🇦", AU: "🇦🇺", DE: "🇩🇪", FR: "🇫🇷", IN: "🇮🇳", JP: "🇯🇵", 
            BR: "🇧🇷", RU: "🇷🇺", MX: "🇲🇽", SA: "🇸🇦", AE: "🇦🇪", TR: "🇹🇷", NL: "🇳🇱", SE: "🇸🇪", 
            NO: "🇳🇴", DK: "🇩🇰", FI: "🇫🇮", PL: "🇵🇱", CZ: "🇨🇿", GR: "🇬🇷", PT: "🇵🇹", IE: "🇮🇪", 
            CH: "🇨🇭", AT: "🇦🇹", BE: "🇧🇪", KR: "🇰🇷", CN: "🇨🇳", ES: "🇪🇸", IT: "🇮🇹"
        };

        let scene, camera, renderer, globe, hitGroup, hitTexture;

        function initThree() {
            const container = document.getElementById('globeContainer');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            camera.position.z = 2.8;

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('globeCanvas'), 
                alpha: true, 
                antialias: true 
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);

            const geometry = new THREE.SphereGeometry(1, 48, 48);
            const material = new THREE.MeshBasicMaterial({
                color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.15
            });
            globe = new THREE.Mesh(geometry, material);
            scene.add(globe);

            const innerGeo = new THREE.SphereGeometry(0.98, 48, 48);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0x050507 });
            scene.add(new THREE.Mesh(innerGeo, innerMat));

            const atmosphereGeo = new THREE.SphereGeometry(1.05, 48, 48);
            const atmosphereMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8, transparent: true, opacity: 0.05, side: THREE.BackSide
            });
            scene.add(new THREE.Mesh(atmosphereGeo, atmosphereMat));

            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(16, 185, 129, 1)');
            gradient.addColorStop(0.3, 'rgba(16, 185, 129, 0.6)');
            gradient.addColorStop(1, 'rgba(16, 185, 129, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            hitTexture = new THREE.CanvasTexture(canvas);

            hitGroup = new THREE.Group();
            scene.add(hitGroup);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            globe.rotation.y += 0.002;
            hitGroup.rotation.y += 0.002; 

            const time = Date.now() * 0.003;
            hitGroup.children.forEach(child => {
                const scale = child.userData.baseScale * (1 + 0.25 * Math.sin(time + child.userData.offset));
                child.scale.set(scale, scale, scale);
            });

            renderer.render(scene, camera);
        }

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        function updateHits(countries) {
            while(hitGroup.children.length > 0) {
                hitGroup.remove(hitGroup.children[0]);
            }

            for (const [code, count] of Object.entries(countries)) {
                if (GEO[code]) {
                    const [lat, lon] = GEO[code];
                    const pos = latLonToVector3(lat, lon, 1.02); 
                    
                    const spriteMat = new THREE.SpriteMaterial({ 
                        map: hitTexture, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
                    });
                    const sprite = new THREE.Sprite(spriteMat);
                    sprite.position.copy(pos);
                    
                    const scale = 0.06 + Math.min(count, 20) * 0.012;
                    sprite.scale.set(scale, scale, scale);
                    sprite.userData = { baseScale: scale, offset: Math.random() * Math.PI * 2 };
                    
                    hitGroup.add(sprite);
                }
            }
        }

        window.addEventListener('resize', () => {
            const container = document.getElementById('globeContainer');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        initThree();

        async function fetchStats() {
            try {
                const response = await fetch(STATS_URL + '?t=' + new Date().getTime());
                if (!response.ok) return;
                const data = await response.json();
                
                const badge = document.getElementById('statusBadge');
                let statusText = 'Idle';
                let statusClass = 'status-idle';

                if (data.status === 'scanning') { statusText = 'Running'; statusClass = 'status-running'; }
                else if (data.status === 'done') { statusText = 'Completed'; statusClass = 'status-done'; }
                else if (data.status === 'stopped') { statusText = 'Stopped'; statusClass = 'status-stopped'; }

                badge.className = `status-badge ${statusClass}`;
                badge.textContent = statusText;

                document.getElementById('totalHits').textContent = data.valid || 0;
                document.getElementById('statChecked').textContent = data.checked || 0;
                document.getElementById('statTwofa').textContent = data.twofa || 0;
                document.getElementById('statBad').textContent = data.bad || 0;

                updateHits(data.countries || {});

                const list = document.getElementById('regionsList');
                list.innerHTML = '';
                const sorted = Object.entries(data.countries || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);
                
                if (sorted.length === 0) {
                    list.innerHTML = '<div style="color:#52525b; font-size:13px; padding:10px 0;">Waiting for hits...</div>';
                } else {
                    sorted.forEach(([code, count]) => {
                        const pct = data.valid > 0 ? Math.round((count / data.valid) * 100) : 0;
                        const flag = FLAGS[code] || "🏴";
                        const item = document.createElement('div');
                        item.className = 'region-item';
                        item.innerHTML = `
                            <div class="region-left">
                                <span class="region-flag">${flag}</span>
                                <span class="region-name">${code}</span>
                            </div>
                            <div class="region-right">
                                <div class="region-count">${count}</div>
                                <div class="region-pct">${pct}%</div>
                            </div>
                        `;
                        list.appendChild(item);
                    });
                }

                const hitsList = document.getElementById('hitsList');
                hitsList.innerHTML = '';
                const hits = data.recent_hits || [];
                
                if (hits.length === 0) {
                    hitsList.innerHTML = '<div style="color:#52525b; font-size:13px; padding:10px 0;">Waiting for hits...</div>';
                } else {
                    hits.forEach(hit => {
                        const services = hit.services && hit.services.length > 0 ? hit.services.join(', ') : 'Inbox';
                        const item = document.createElement('div');
                        item.className = 'hit-item';
                        item.innerHTML = `
                            <div>
                                <div class="hit-email">${hit.email}</div>
                                <div class="hit-meta">
                                    <span>${hit.flag} ${hit.country}</span>
                                    <span>•</span>
                                    <span>${services}</span>
                                </div>
                            </div>
                            <div class="hit-time">${hit.time}</div>
                        `;
                        hitsList.appendChild(item);
                    });
                }

            } catch (e) {}
        }

        setInterval(fetchStats, 2000);
        fetchStats();
    </script>
</body>
</html>
